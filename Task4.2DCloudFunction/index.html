<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Linda Light Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Remote Lights Control</h1>
    <p id="globalStatus" class="status">Toggle a room to call the device function and switch the LED</p>

    <div class="room">
      <label for="living">Living Room</label>
      <input id="living" class="toggle" type="checkbox" data-room="living room" />
      <div id="livingroomStatus" class="room-status"></div>
    </div>

    <div class="room">
      <label for="bath">Bathroom</label>
      <input id="bath" class="toggle" type="checkbox" data-room="bathroom" />
      <div id="bathroomStatus" class="room-status"></div>
    </div>

    <div class="room">
      <label for="closet">Closet</label>
      <input id="closet" class="toggle" type="checkbox" data-room="closet" />
      <div id="closetStatus" class="room-status"></div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
